server {
  listen 4200;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ^~ makes this win over the static-file rules below
  location ^~ /api/ {
    proxy_pass http://backend:5000/;     # the trailing slash strips /api
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 3m;             # photos are limited to 2 MB
    proxy_read_timeout 60s;
  }

  # Never cache the shell, so a new deploy is picked up immediately
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Angular's hashed bundles can be cached for a long time
  location ~* \.(?:js|css|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;    # lets Angular's router handle /profile, /settings
  }
}